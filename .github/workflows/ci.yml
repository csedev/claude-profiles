name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only builds and tests; the token needs nothing beyond checkout.
permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported toolchains: macos-15 ships Xcode 16,
        # macos-26 ships Xcode 26.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      # Tests that need a running Claude desktop app skip themselves rather
      # than failing — CI runners do not have it.
      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./Scripts/build-app.sh debug
